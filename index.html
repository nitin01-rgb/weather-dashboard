<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">

```
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">W</span>
            <div>
                <h1>Weather</h1>
                <p>Local conditions & forecast</p>
            </div>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            Live weather
        </div>
    </header>

    <main>

        <section class="search-box">
            <div class="search-input">
                <span>⌕</span>
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Search for a city..."
                    autocomplete="off"
                >
            </div>
            <button onclick="searchWeather()">Search</button>
        </section>

        <section class="current-weather">

            <div class="location-info">
                <p class="label">CURRENT WEATHER</p>
                <h2 id="cityName">Jaipur</h2>
                <p id="condition">Clear Sky</p>
            </div>

            <div class="main-temperature">
                <span id="temperature">28°</span>
                <span class="unit">C</span>
            </div>

        </section>

        <section class="weather-details">

            <div class="weather-card">
                <div class="card-top">
                    <span class="detail-icon">Humidity</span>
                </div>
                <p id="humidity">65%</p>
                <small>Relative humidity</small>
            </div>

            <div class="weather-card">
                <div class="card-top">
                    <span class="detail-icon">Wind</span>
                </div>
                <p id="wind">12 km/h</p>
                <small>Current wind speed</small>
            </div>

            <div class="weather-card">
                <div class="card-top">
                    <span class="detail-icon">Feels like</span>
                </div>
                <p id="feels">30°C</p>
                <small>Feels like temperature</small>
            </div>

            <div class="weather-card">
                <div class="card-top">
                    <span class="detail-icon">UV Index</span>
                </div>
                <p id="uv">6</p>
                <small>UV exposure level</small>
            </div>

        </section>

        <section class="forecast">
            <div class="section-heading">
